version: '3.8'

services:
  bank-svc:
    image: bank-app:v1.1
    build: .
    container_name: bank
    ports:
      - "3000:3000"

    environment:
      - MONGODB_URI=mongodb://mongodb:27017/transactionhistory
    
    depends_on:
      - mongodb
  
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"

